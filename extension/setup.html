<!doctype html><meta charset="utf-8"><title>起動設定</title>
<h1>ブラウザーからの起動設定</h1><p id="error"></p>
<ol><li>プロジェクト内の <strong>install-edge.cmd</strong>（Edge）または <strong>install-chrome.cmd</strong>（Chrome）を実行してください。</li><li>拡張機能の管理画面（edge://extensions または chrome://extensions）で拡張を再読み込みしてください。</li><li>拡張アイコンをもう一度クリックしてください。</li></ol>
<p>自動検出できない場合は、使用中のブラウザーに対応するコマンドを実行してください:</p><pre id="command"></pre><script src="setup.js"></script>
