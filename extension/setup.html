<!doctype html><html lang="ja"><meta charset="utf-8"><title>Agent Token Viewer — 起動設定</title><script src="setup.js" defer></script><body>
<h1>Edgeからの起動設定</h1><p id="error"></p>
<ol><li>プロジェクト内の <strong>install-edge.cmd</strong> を一度実行してください。</li><li><strong>edge://extensions</strong> で拡張を再読み込みしてください。追加権限の承認を求められた場合は確認してください。</li><li>拡張アイコンをもう一度クリックしてください。</li></ol>
<p>自動検出で登録できない場合は、プロジェクトのフォルダーで次を実行してください。</p><pre id="command"></pre>
<p>旧版のstart.cmdで起動中の場合は、そのウィンドウでCtrl+Cを押して停止してから再試行してください。</p>
</body></html>
